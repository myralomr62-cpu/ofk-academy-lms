<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFK Academy - المنصة التعليمية الرسمية</title>
    <!-- استيراد خطوط وتصميم أنيق -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <!-- الهيدر أو الشريط العلوي -->
    <header class="bg-blue-900 text-white shadow-md">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">OFK Academy</h1>
            <span class="text-sm bg-blue-800 px-3 py-1 rounded-full">بالشراكة مع جامعة الزهراء</span>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="container mx-auto px-6 py-16 text-center">
        <div class="max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow-lg border border-slate-100">
            <h2 class="text-3xl font-extrabold text-blue-900 mb-4">مرحباً بك في أكلاديمية أوفك</h2>
            <p class="text-slate-600 text-lg mb-8">
                منصتك الأكاديمية المستقلة والمتكاملة لتطوير المهارات، البرامج التعليمية المعتمدة، وإدارة مسارك التدريبي بكل احترافية.
            </p>

            <!-- الأزرار التفاعلية -->
            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <a href="verify.html" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-xl shadow transition duration-200">
                    🔍 التحقق من الشهادات (QR)
                </a>
                <a href="#courses" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-6 py-3 rounded-xl shadow transition duration-200">
                    📚 البرامج التعليمية
                </a>
            </div>
        </div>
    </main>

    <!-- التذييل (Footer) -->
    <footer class="text-center py-6 text-slate-500 text-sm mt-12 border-t border-slate-200">
        جميع الحقوق محفوظة لصالح OFK Academy &copy; 2026
    </footer>

</body>
</html>
